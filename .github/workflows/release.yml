name: release

# Push a version tag (git tag v0.1.0 && git push origin v0.1.0) to build
# binaries for macOS and Linux, publish a GitHub Release, and commit the
# Homebrew cask (Casks/blob.rb) to main in this same repo.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the release, upload archives, commit the cask

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the changelog needs history and tags

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
